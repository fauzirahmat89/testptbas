services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laravel

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  worker:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - redis
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - laravel

  redis:
    image: redis:alpine
    ports:
      - "8099:6379"
    networks:
      - laravel

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-testptbas}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel


networks:
  laravel:
    driver: bridge

volumes:
  db_data:
