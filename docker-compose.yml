services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laravel

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  worker:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - redis
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - laravel

  redis:
    image: redis:alpine
    ports:
      - "8099:6379"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
